# Long-lived caching for static media so repeat visits don't re-download them.
# webdevops/php-nginx includes every *.conf here inside the vhost server block.
location ~* \.(jpe?g|png|webp|gif|ico|svg|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    access_log off;
}
